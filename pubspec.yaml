name: pencil_reminders
description: A simple, tactile Android reminder and alarm app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  file_picker: ^8.1.4
  audioplayers: ^6.1.0
  android_alarm_manager_plus: ^4.0.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
