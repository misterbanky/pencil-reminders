name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android files if missing
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            cp lib/main.dart /tmp/main.dart.bak
            flutter create --no-pub --overwrite --platforms=android --project-name pencil_reminders --org com.pencil.reminders .
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            mkdir -p lib
            cp /tmp/main.dart.bak lib/main.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pencil-reminders-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
